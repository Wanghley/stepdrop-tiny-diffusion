name: Publish report site

# Renders docs/ (Quarto website) and deploys it to GitHub Pages.
# Pages must be set to "Build and deployment → Source: GitHub Actions"
# (already the case for this repo).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9 # version the site was built and checked with

      - name: Render site
        run: quarto render docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - id: deployment
        uses: actions/deploy-pages@v4
